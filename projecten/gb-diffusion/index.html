<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Boy Diffusion</title>
<style>
:root{--bg:#16181d;--panel:#22252c;--line:#363a44;--text:#eef0f3;--dim:#9aa1ad;--yellow:#FFD02F;--green:#9bd17a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.speler{display:grid;grid-template-columns:auto 240px;gap:28px;align-items:center;max-width:100%}
.scherm{background:#0b0c0f;border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
canvas{display:block;image-rendering:pixelated;width:min(480px,calc(100vw - 340px),calc((100vh - 60px) * 160 / 144));aspect-ratio:160/144;height:auto;background:#000;border-radius:4px}
.bedien{display:flex;flex-direction:column;gap:14px}
.rij{display:flex;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.pijl{flex:1;height:52px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:20px}
.pijl:active,.pijl.is-in{background:#2e323b}
.a{height:64px;border-radius:999px;background:var(--yellow);color:#1a1a1a;font-weight:700;font-size:17px}
.a:active,.a.is-in{filter:brightness(.92)}
.a:disabled{opacity:.45;cursor:default}
.snelheid{display:flex;background:var(--panel);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.snelheid button{flex:1;padding:9px 6px;border-radius:999px;background:transparent;color:var(--dim);font-size:14px}
.snelheid button[aria-pressed=true]{background:#3a3f4a;color:var(--text)}
.meter{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px;min-height:3.9em}
.meter b{color:var(--text);font-weight:600}
.balk{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;margin:6px 0 8px}
.balk i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.toetsen{color:var(--dim);font-size:12px}
.laden{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--dim)}
@media (max-width:640px),(max-aspect-ratio:1/1){
  body{align-items:flex-start;overflow:auto}
  .speler{grid-template-columns:1fr;gap:16px;width:100%;max-width:420px}
  .scherm{padding:10px}
  canvas{width:100%}
  .toetsen{display:none}
}
</style>
</head>
<body>
<div class="speler">
  <div class="scherm"><canvas id="lcd" width="160" height="144" aria-label="Scherm van de Game Boy Color"></canvas></div>
  <div class="bedien">
    <div class="rij">
      <button class="pijl" data-knop="left" aria-label="Vorige categorie">&#9664;</button>
      <button class="pijl" data-knop="right" aria-label="Volgende categorie">&#9654;</button>
    </div>
    <button class="a" data-knop="a" id="teken">A &middot; Teken</button>
    <div class="snelheid" role="group" aria-label="Snelheid">
      <button data-x="1" aria-pressed="false">Echte snelheid</button>
      <button data-x="10" aria-pressed="true">10x sneller</button>
    </div>
    <div class="meter" id="meter" aria-live="polite">Kies met de pijlen een categorie en druk op A.</div>
    <div class="toetsen">Toetsenbord: pijlen links en rechts, A met Z, spatie of Enter.</div>
  </div>
</div>
<div class="laden" id="laden">ROM laden&hellip;</div>
<script type="module" src="speler.js?v=2"></script>
</body>
</html>
